apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kip-observability
  namespace: argocd
spec:
  project: kip
  source:
    repoURL: https://github.com/stas727/kubernetes-in-production-course.git
    targetRevision: module05
    path: module-05-observability/argocd/applications
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
