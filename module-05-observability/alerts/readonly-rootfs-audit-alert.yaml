apiVersion: v1
kind: ConfigMap
metadata:
  name: readonly-rootfs-audit-alert
  namespace: monitoring
  labels:
    grafana_alert: "1"
data:
  readonly-rootfs-audit-alert.yaml: |
    apiVersion: 1
    groups:
      - orgId: 1
        name: readonly-rootfs-audit
        folder: Kyverno Policy Audits
        interval: 1m
        rules:
          - uid: readonly-rootfs-audit-fail
            title: "Readonly rootfs audit violation detected"
            condition: C
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: >-
                A pod failed the require-readonly-rootfs Kyverno audit
                policy in the last minute.
            data:
              - refId: A
                datasourceUid: loki
                relativeTimeRange:
                  from: 60
                  to: 0
                model:
                  expr: >-
                    count_over_time({app_kubernetes_io_component="admission-controller", app_kubernetes_io_part_of="kyverno"} |= "validation error" |= "require-readonly-rootfs" [1m])
                  queryType: range
              - refId: C
                datasourceUid: "__expr__"
                model:
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator:
                        type: gt
                        params: [0]
