apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-person-label
spec:
  rules:
    - name: label-student-namespaces
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - student01
                - student02
                - student03
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              person: student
    - name: label-mentor-namespace
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - mentor
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              person: mentor
