apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: kip
  source:
    repoURL: https://kyverno.github.io/kyverno/
    chart: kyverno
    targetRevision: "3.9.1"
    helm:
      releaseName: kyverno
      values: |
        features:
          logging:
            verbosity: 3
          # Drop the default filter that specifically omits
          # PolicyApplied/PolicySkipped events, so nothing relevant is
          # silently dropped at the source.
          omitEvents:
            eventTypes: []
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno-system
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      # Kyverno's CRDs are large enough that client-side apply's
      # last-applied-configuration annotation exceeds the 256KB limit.
      - ServerSideApply=true
    automated:
      prune: true
      selfHeal: true
