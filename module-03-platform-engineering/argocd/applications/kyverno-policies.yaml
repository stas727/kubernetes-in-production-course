apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: kip
  source:
    repoURL: https://github.com/stas727/kubernetes-in-production-course.git
    targetRevision: module04 # TODO: switch back to main after merging
    path: module-03-platform-engineering/charts/kyverno-policies
    helm:
      parameters:
        - name: istioInjectionLabel.enabled
          value: "true"
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
