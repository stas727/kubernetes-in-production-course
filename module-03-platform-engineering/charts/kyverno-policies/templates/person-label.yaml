{{- if .Values.personLabel.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ .Values.personLabel.policyName }}
spec:
  rules:
    - name: label-student-namespaces
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces: {{ .Values.personLabel.students.namespaces | toYaml | nindent 16 }}
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              {{ .Values.personLabel.labelKey }}: {{ .Values.personLabel.students.labelValue }}
    - name: label-mentor-namespace
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces: {{ .Values.personLabel.mentor.namespaces | toYaml | nindent 16 }}
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              {{ .Values.personLabel.labelKey }}: {{ .Values.personLabel.mentor.labelValue }}
    {{- if .Values.istioInjectionLabel.enabled }}
    - name: {{ .Values.istioInjectionLabel.policyName }}
      match:
        any:
          - resources:
              kinds:
                - Pod
      preconditions:
        all:
          - key: "{{ `{{ request.object.metadata.labels.` }}{{ .Values.istioInjectionLabel.personLabelKey }}{{ ` || '' }}` }}"
            operator: Equals
            value: {{ .Values.istioInjectionLabel.personLabelValue | quote }}
      mutate:
        patchStrategicMerge:
          metadata:
            labels:
              {{ .Values.istioInjectionLabel.injectLabelKey }}: {{ .Values.istioInjectionLabel.injectLabelValue | quote }}
    {{- end }}
{{- end }}
