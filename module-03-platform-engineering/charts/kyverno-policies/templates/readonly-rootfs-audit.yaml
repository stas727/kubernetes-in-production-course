{{- if .Values.readonlyRootfsAudit.enabled }}
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: {{ .Values.readonlyRootfsAudit.policyName }}
spec:
  validationFailureAction: {{ .Values.readonlyRootfsAudit.validationFailureAction }}
  background: {{ .Values.readonlyRootfsAudit.background }}
  rules:
    - name: validate-readonly-rootfs
      match:
        any:
          - resources:
              kinds:
                - Pod
      validate:
        message: "Container must set securityContext.readOnlyRootFilesystem=true"
        pattern:
          spec:
            containers:
              - securityContext:
                  readOnlyRootFilesystem: true
{{- end }}
